# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      ftpHost:
        type: string
        default: localhost
        description: FTP/FTPS/SFTP server hostname or IP address.
      ftpPort:
        type: number
        description: Server port. If omitted, FTP/FTPS uses 21 and SFTP uses 22.
      ftpUser:
        type: string
        default: anonymous
        description: >
          FTP/FTPS/SFTP username. May be an encrypted value
          (enc:<iv_hex>:<tag_hex>:<ciphertext_hex>) when an encryption key is available.
      ftpPassword:
        type: string
        format: password
        default: ""
        description: >
          FTP/FTPS/SFTP password. Supports encrypted values
          (enc:<iv_hex>:<tag_hex>:<ciphertext_hex>).
      ftpProtocol:
        type: string
        enum: [ftp, sftp]
        default: ftp
        description: >
          Connection protocol. "ftp" uses basic-ftp and can optionally enable TLS/FTPS;
          "sftp" uses SSH File Transfer Protocol and is always encrypted over SSH.
      ftpSecure:
        type: boolean
        default: false
        description: >
          Enable TLS/FTPS when ftpProtocol is "ftp". This setting is not used for SFTP,
          because SFTP is already encrypted over SSH.
      ftpPrivateKeyPath:
        type: string
        default: ""
        description: >
          SFTP private-key path (for example ~/.ssh/id_ed25519) or a 1Password
          op:// secret reference. Leave empty to auto-detect common ~/.ssh keys.
      ftpPassphrase:
        type: string
        format: password
        default: ""
        description: >
          Passphrase for the SFTP private key. Supports encrypted enc: values.
      ftpEncryptionKey:
        type: string
        format: password
        description: >
          Optional 64-character hex AES-256 key for decrypting enc: credentials.
          For local installs, prefer the OS keychain or a global environment variable
          instead of storing this alongside encrypted credentials.
  commandFunction:
    |-
    (config) => ({
      command: 'node',
      args: ['build/index.js'],
      env: {
        FTP_HOST: config.ftpHost || 'localhost',
        FTP_PORT: String(config.ftpPort ?? (config.ftpProtocol === 'sftp' ? 22 : 21)),
        FTP_USER: config.ftpUser || 'anonymous',
        FTP_PASSWORD: config.ftpPassword || '',
        FTP_PROTOCOL: config.ftpProtocol || 'ftp',
        ...(config.ftpProtocol !== 'sftp' && config.ftpSecure ? { FTP_SECURE: 'true' } : {}),
        ...(config.ftpPrivateKeyPath ? { FTP_PRIVATE_KEY_PATH: config.ftpPrivateKeyPath } : {}),
        ...(config.ftpPassphrase ? { FTP_PASSPHRASE: config.ftpPassphrase } : {}),
        ...(config.ftpEncryptionKey ? { FTP_ENCRYPTION_KEY: config.ftpEncryptionKey } : {})
      }
    })
  exampleConfig:
    ftpHost: sftp.example.com
    ftpPort: 22
    ftpUser: your-username
    ftpPassword: ""
    ftpProtocol: sftp
    ftpPrivateKeyPath: ""
    ftpPassphrase: ""
